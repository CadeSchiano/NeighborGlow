name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci

      - name: Verify iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist
